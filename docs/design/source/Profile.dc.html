<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Cut · Robot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF1F7; color: #0A0B0D; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">

  <div style="position: relative; height: 154px; border-bottom: 2px solid #0A0B0D; overflow: hidden; background: {{c.heroBg}}">
    <sc-if value="{{c.hasSticker}}" hint-placeholder-val="{{ true }}">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(rgba(255, 255, 255, 0.28) 1.6px, transparent 1.8px) 0 0 / 18px 18px"></div>
      <img src="{{c.sticker}}" alt="{{c.name}}" style="position: absolute; left: 50%; bottom: -6px; height: 154px; width: auto; display: block; transform: translateX(-50%) rotate(-2deg)">
    </sc-if>
    <sc-if value="{{c.noSticker}}" hint-placeholder-val="{{ false }}">
      <img src="{{c.img}}" alt="{{c.name}}" style="width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block">
    </sc-if>
    <button type="button" onClick="{{back}}" aria-label="Back to the lineup" style="position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 2px solid #0A0B0D; box-shadow: 2px 2px 0 #0A0B0D; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div style="position: absolute; right: 16px; top: 16px; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; box-sizing: border-box; border-radius: 999px; background: {{c.rankBg}}; border: 2px solid #0A0B0D; box-shadow: 2px 2px 0 #0A0B0D; font-size: 12.5px; font-weight: 800; white-space: nowrap">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      {{c.rank}}
    </div>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 20px 0">

    <div style="font-size: 13px; font-weight: 700; color: #4B5160; white-space: nowrap">{{c.x}}</div>

  <div style="padding: 0 20px; font-size: 14px; color: #4B5160; white-space: nowrap">{{c.kind}}</div>

  <div style="display: flex; align-items: center; gap: 8px; margin: 8px 20px 0; height: 38px; padding: 0 6px 0 10px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; border: 2px solid #0A0B0D">

    </div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 20px 0">
    <sc-for list="{{c.tiles}}" as="t" hint-placeholder-count="3">

      </div>

  <sc-if value="{{c.hasPays}}" hint-placeholder-val="{{ true }}">

      </span>

    </div>
    <sc-for list="{{c.posts}}" as="p" hint-placeholder-count="2">
      <div style="padding: 6px 0 7px; border-top: {{p.line}}; margin-top: {{p.gap}}">
        <div style="font-size: 13px; line-height: 18px; font-weight: 500; text-wrap: pretty">“{{p.text}}”</div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px">

        </div>
      </div>
    </sc-for>
  </div>

  <button type="button" onClick="{{toVerify}}" aria-label="Check the Director's line on NEAR AI" style="display: flex; align-items: center; gap: 10px; width: 350px; margin: 10px 20px 0; padding: 7px 12px 7px 8px; box-sizing: border-box; border-radius: 16px; background: #FF7AD9; border: 2px solid #0A0B0D; text-align: left; font-family: Inter, sans-serif; color: #0A0B0D">
    <span style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 9px; background: #8B6CFF; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/></svg></span>
    <span style="flex-grow: 1; min-width: 0">
      <span style="display: block; font-size: 13px; line-height: 17px; font-weight: 700">“{{c.line}}”</span>
      <span style="display: flex; align-items: center; gap: 4px; margin-top: 1px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.4px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0">The Director ·</span><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>VERIFIED · NEAR AI</span>
    </span>
  </button>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 10px 20px 20px; background: #EEF1F7; border-top: 2px solid #0A0B0D">
    <sc-if value="{{showSave}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{toSave}}" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; height: 54px; border-radius: 18px; background: #C6F432; border: 2px solid #0A0B0D; box-shadow: 3px 3px 0 #0A0B0D; font: 700 16px Inter, sans-serif; color: #0A0B0D; white-space: nowrap"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 5v14M5 12h14"/></svg>{{saveLabel}}</button>
    </sc-if>
    <sc-if value="{{showPlan}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{toPlan}}" style="flex: 1 1 0; min-width: 0; height: 54px; border-radius: 18px; background: #FFFFFF; border: 2px solid #0A0B0D; box-shadow: 3px 3px 0 #0A0B0D; font: 700 16px Inter, sans-serif; color: #0A0B0D; white-space: nowrap">Today’s cut</button>
    </sc-if>
  </div>
</div>
</x-dc>

        bannerBg: b ? b.bg : '#FFFFFF',
        bannerInk: b ? b.ink : '#0A0B0D',
        hasMeter: !!(b && b.meter),
        meter: b && b.meter ? b.meter : 0,
        meterLeft: b && b.meterLeft ? b.meterLeft : '',
        meterRight: b && b.meterRight ? b.meterRight : '',
        tiles: [
          { label: bench ? 'Queue, $CUT' : 'Pile, $CUT', value: fmt(r.pile), icon: TILE_ICONS.pile, bg: v === 'kiko' ? '#FFE7D6' : '#FFFFFF' },
          { label: 'Savers', value: fmt(r.savers), icon: TILE_ICONS.savers, bg: '#FFFFFF' },
          { label: 'Saved today', value: `+${fmt(r.today)}`, icon: TILE_ICONS.today, bg: '#FFFFFF' }
        ],
        hasPays: !!pays,
        pays: pays ? pays.value : '',
        paysNote: pays ? pays.note : '',
        line: r.line,
        posts: r.posts.map(([text, when], i) => ({ text, when, line: i ? '1.5px solid #EEF1F7' : '0', gap: i ? '0' : '2px' }))
      },
      showSave: true,
      saveLabel: v === 'kiko' ? 'Save Kiko Bun' : bench ? 'Add to its queue' : v === 'melody' ? 'Save more here' : `Save ${r.name}`,
      showPlan: v === 'kiko' || bench,
      back: this.nav('cast', bench ? 'rebalance' : visitor ? 'new' : 'list'),
      toSave: visitor ? this.nav('cast', 'connect') : this.nav('club', 'vote'),
      toVerify: this.nav('brain', 'verify'),
      toPlan: this.nav('director', 'scheduled')
    };
  }
}
</script>
</body>
</html>
