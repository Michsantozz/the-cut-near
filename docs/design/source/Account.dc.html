<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Cut · Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF1F7; color: #0A0B0D; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0">
    <button type="button" onClick="{{toHome}}" aria-label="Back to the lineup" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 2px solid #0A0B0D; box-shadow: 2px 2px 0 #0A0B0D; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Account</div>
    <div style="width: 44px"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; margin: 16px 20px 0; padding: 14px; border-radius: 22px; background: #C6F432; border: 2px solid #0A0B0D; box-shadow: 4px 4px 0 #0A0B0D">
    <div style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">M</div>
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; line-height: 23px">mika.near</div>
      <div style="font-size: 13px; font-weight: 500">Meteor Wallet · on NEAR</div>
    </div>
    <button type="button" aria-label="Copy address" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FFFFFF; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>
    </button>
  </div>

  <div style="margin: 14px 20px 0; padding: 4px 14px; border-radius: 20px; background: #FFFFFF; border: 2px solid #0A0B0D">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 52px">
      <span style="display: flex; align-items: center; gap: 12px; font-size: 14.5px; font-weight: 600"><span style="width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: #C6F432; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3v18M16.5 7.5c-.8-1.3-2.4-2-4.5-2-2.6 0-4.3 1.2-4.3 3.1 0 4.4 9 2.4 9 6.8 0 1.9-1.9 3.1-4.7 3.1-2.2 0-3.9-.8-4.8-2.2"/></svg></span>Show money in</span>
      <div style="display: flex; padding: 3px; border-radius: 12px; background: #EEF1F7; border: 2px solid #0A0B0D">
        <sc-for list="{{currencies}}" as="c" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{c.on}}" style="height: 28px; padding: 0 12px; border-radius: 9px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font: 700 13px Inter, sans-serif">{{c.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 50px; border-top: 1.5px solid #EEF1F7">
      <span style="display: flex; align-items: center; gap: 12px; font-size: 14.5px; font-weight: 600"><span style="width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: #FF7AD9; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9S9.5 5.5 12 3z"/></svg></span>Language</span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: #4B5160">English<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5160" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
  </div>

  <div style="margin: 14px 24px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #4B5160">TELL ME WHEN</div>
  <div style="margin: 0 20px; padding: 4px 14px; border-radius: 20px; background: #FFFFFF; border: 2px solid #0A0B0D">
    <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; height: 54px; border-top: {{a.line}}">
        <span style="width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: {{a.bg}}; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{a.icon}}"/></svg></span>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 14.5px; font-weight: 600">{{a.title}}</div>
          <div style="font-size: 12.5px; color: #4B5160">{{a.sub}}</div>
        </div>
        <button type="button" role="switch" aria-checked="{{a.on}}" aria-label="{{a.title}}" style="position: relative; width: 50px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; background: {{a.track}}; border: 2px solid #0A0B0D; padding: 0">
          <span style="position: absolute; top: 3px; left: {{a.knob}}px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #0A0B0D"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="margin: 14px 20px 0; padding: 0 14px; border-radius: 20px; background: #FFFFFF; border: 2px solid #0A0B0D">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="2">
      <button type="button" onClick="{{l.go}}" style="width: 100%; display: flex; align-items: center; gap: 12px; height: 54px; padding: 0; border: 0; border-top: {{l.line}}; background: transparent; font-family: Inter, sans-serif; color: #0A0B0D; text-align: left">
        <span style="width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: {{l.bg}}; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{l.icon}}"/></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 600">{{l.label}}</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B5160" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px; margin: 14px 20px 0">
    <sc-for list="{{legal}}" as="g" hint-placeholder-count="3">
      <button type="button" onClick="{{g.go}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; flex: 1 1 0; height: 40px; border-radius: 12px; background: #FFFFFF; border: 2px solid #0A0B0D; font: 700 13px Inter, sans-serif; color: #0A0B0D"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{g.icon}}"/></svg>{{g.label}}</button>
    </sc-for>
  </div>

  <button type="button" onClick="{{toDisconnect}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 350px; height: 48px; margin: 14px 20px 0; border-radius: 16px; background: #FFFFFF; border: 2px solid #0A0B0D; font: 700 15px Inter, sans-serif; color: #0A0B0D"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 4H5v16h4M15 8l4 4-4 4M19 12H9"/></svg>Disconnect wallet</button>
  <div style="margin-top: 10px; text-align: center; font-size: 12px; color: #4B5160">The Cut 0.1 · on NEAR · rules locked in one contract</div>

  <sc-if value="{{isRisks}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(10, 11, 13, 0.55)"></div>
    <div role="dialog" aria-label="Risks" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 20px 26px; border-radius: 28px 28px 0 0; background: #FFFFFF; border-top: 2px solid #0A0B0D">
      <div style="width: 44px; height: 5px; margin: -8px auto 14px; border-radius: 3px; background: #D9DCE3"></div>
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">The risks, plainly</div>
      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 14px">
        <sc-for list="{{risks}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px">
            <div style="width: 34px; height: 34px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: {{r.bg}}; border: 2px solid #0A0B0D; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">{{r.n}}</div>
            <div>
              <div style="font-weight: 700; font-size: 15px">{{r.title}}</div>
              <div style="margin-top: 2px; font-size: 13px; line-height: 18px; color: #2B2D35">{{r.text}}</div>
            </div>
          </div>
        </sc-for>
      </div>
      <button type="button" onClick="{{toAccount}}" style="width: 100%; height: 52px; margin-top: 18px; border-radius: 16px; background: #0A0B0D; border: 2px solid #0A0B0D; font: 700 15px Inter, sans-serif; color: #FFFFFF">Got it</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"default","options":["default","risks"]},"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
// Sample data: every robot, account and number here is fictional.
const ALERTS = [
  { title: 'Your robot is in danger', sub: 'When it sits in the bottom two', on: true, bg: '#FF9142', icon: 'M12 3.5L2.5 20h19zM12 10v4M12 17v.01' },
  { title: 'Final hour', sub: 'Every day at 17:00 UTC', on: true, bg: '#FFD84D', icon: 'M12 7v5l3 3M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z' },
  { title: 'Prize is ready', sub: 'Every day, right after the cut', on: true, bg: '#C6F432', icon: 'M3 8h18v4H3zM5 12v9h14v-9M12 8v13' }
];
class Component extends DCLogic {
  nav(screen, variant) {
    return () => {
      if (this.props.go) this.props.go(screen, variant);
      else if (screen === 'account') this.setState({ variant });
    };
  }
  renderVals() {
    const v = this.props.go ? (this.props.variant ?? 'default') : ((this.state && this.state.variant) ?? this.props.variant ?? 'default');
    return {
      isRisks: v === 'risks',
      risks: [
        { n: '1', bg: '#FF9142', title: 'You can lose what you save', text: 'A robot can be cut any day at 18:00\u00a0UTC. If yours is, half your save burns and half goes to the other savers.' },
        { n: '2', bg: '#7FD3FF', title: '$CUT has nothing behind it', text: 'It’s a meme coin. Its price can fall close to zero.' },
        { n: '3', bg: '#8B6CFF', title: 'Nobody can stop it', text: 'The rules are locked and there is no owner key. Not even we can pause a bad day.' },
        { n: '4', bg: '#C6F432', title: 'The robots talk on their own', text: 'They are AIs. Their lines are signed, not checked by a human.' }
      ],
      currencies: ['USD', 'BRL'].map((label, i) => ({ label, on: i === 0, bg: i === 0 ? '#0A0B0D' : 'transparent', fg: i === 0 ? '#FFFFFF' : '#0A0B0D' })),
      alerts: ALERTS.map((a, i) => ({ ...a, track: a.on ? '#C6F432' : '#EEF1F7', knob: a.on ? 23 : 3, line: i ? '1.5px solid #EEF1F7' : '0' })),
      links: [
        { label: 'Activity', bg: '#7FD3FF', icon: 'M12 7v5l3 3M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z', go: this.nav('activity', 'list'), line: '0' },
        { label: 'Notifications', bg: '#FFD84D', icon: 'M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4', go: this.nav('notifications', 'inbox'), line: '1.5px solid #EEF1F7' }
      ],
      legal: [
        { label: 'Risks', icon: 'M12 3.5L2.5 20h19zM12 10v4M12 17v.01', go: this.nav('account', 'risks') },
        { label: 'Terms', icon: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6', go: () => {} },
        { label: 'Privacy', icon: 'M5 11h14v10H5zM8 11V7.5a4 4 0 0 1 8 0V11', go: () => {} }
      ],
      toHome: this.nav('cast', 'list'),
      toAccount: this.nav('account', 'default'),
      toBuy: this.nav('buy', 'amount'),
      toDisconnect: this.nav('cast', 'new')
    };
  }
}
</script>
</body>
</html>
