<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Cut · Share</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF1F7; color: #0A0B0D; font-family: Inter, system-ui, sans-serif">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0">
    <button type="button" onClick="{{back}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 2px solid #0A0B0D; box-shadow: 2px 2px 0 #0A0B0D; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Share</div>
    <div style="width: 44px"></div>
  </div>

  <div style="position: relative; margin: 22px 20px 0; height: 233px; box-sizing: border-box; overflow: hidden; border-radius: 22px; background: {{c.ground}}; border: 2px solid #0A0B0D; box-shadow: 5px 5px 0 #0A0B0D">
    <span style="position: absolute; left: 16px; top: 16px; padding: 3px 9px; border-radius: 999px; background: #0A0B0D; color: #FFFFFF; font-size: 10px; font-weight: 800; letter-spacing: 0.5px">{{c.tag}}</span>
    <div style="position: absolute; left: 16px; top: 46px; width: {{c.headW}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 29px; letter-spacing: -1px">{{c.head}}</div>
    <div style="position: absolute; left: 16px; top: {{c.subTop}}; width: 190px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px; line-height: 18px; color: #0052FF">{{c.sub}}</div>
    <div style="position: absolute; left: 16px; bottom: 14px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 13px">the cut <span style="font-family: Inter, sans-serif; font-weight: 600">· on NEAR</span></div>
    <sc-for list="{{c.tiles}}" as="t" hint-placeholder-count="2">
      <div aria-hidden="true" style="position: absolute; left: {{t.x}}; top: {{t.y}}; width: {{t.s}}; height: {{t.s}}; box-sizing: border-box; overflow: hidden; border-radius: 18px; border: 2px solid #0A0B0D; box-shadow: 4px 4px 0 #0A0B0D; transform: rotate({{t.r}}); background: {{t.bg}}; display: flex; align-items: flex-end; justify-content: center">
        <img src="{{t.img}}" alt="" style="width: {{t.w}}; height: {{t.h}}; object-fit: cover; display: block; filter: {{t.filter}}; opacity: {{t.op}}">
      </div>
    </sc-for>
    <sc-if value="{{c.stamp}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 204px; top: 64px; padding: 2px 9px; border: 3px solid #FF3B3B; border-radius: 9px; color: #FF3B3B; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.5px; transform: rotate(-16deg); background: rgba(255, 255, 255, 0.85)">DELETED</div>
      <div style="position: absolute; left: 300px; top: 196px; padding: 2px 9px; border-radius: 999px; background: #0A0B0D; color: #C6F432; font-size: 12px; font-weight: 800; transform: rotate(6deg)">NEW</div>
    </sc-if>
  </div>

  <div style="display: flex; gap: 10px; align-items: center; margin: 14px 20px 0; padding: 10px 12px; border-radius: 18px; background: #FFFFFF; border: 2px solid #0A0B0D">
    <div style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; background: {{q.bg}}; border: 2px solid #0A0B0D; overflow: hidden; display: flex; justify-content: center"><img src="{{q.img}}" alt="" style="display: block; width: {{q.w}}; height: {{q.h}}; object-fit: cover; margin-top: {{q.mt}}"></div>
    <div style="min-width: 0">
      <div style="font-size: 11.5px; font-weight: 700; color: #4B5160">{{q.label}}</div>
      <div style="font-size: 14px; line-height: 19px; font-weight: 700">{{q.line}}</div>
    </div>
  </div>

  <div style="margin: 12px 20px 0; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 2px solid #0A0B0D">
    <div style="font-size: 12px; font-weight: 700; color: #4B5160">YOUR POST</div>
    <div style="margin-top: 4px; font-size: 14.5px; line-height: 21px">{{c.text}}</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 10px">
    <a href="https://x.com/intent/post" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 18px; background: #0A0B0D; border: 2px solid #0A0B0D; box-shadow: 3px 3px 0 #0A0B0D; font: 700 16px Inter, sans-serif; color: #FFFFFF; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
      Post on X
    </a>
    <div style="display: flex; gap: 10px">
      <a href="https://t.me/share/url" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 16px; background: #8B6CFF; border: 2px solid #0A0B0D; font: 700 15px Inter, sans-serif; color: #FFFFFF; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg>Telegram</a>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1 1 0; height: 50px; border-radius: 16px; background: #FFFFFF; border: 2px solid #0A0B0D; font: 700 15px Inter, sans-serif; color: #0A0B0D"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>Copy link</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"cut","options":["cut","joined","creator"]},"go":{"editor":null},"member":{"editor":null},"$preview":{"width":390,"height":844}}'>
// Sample data: every robot, account and number here is fictional. No dollar amounts on share cards.
// Kiko and Melody use their full-body stickers; Chartwise has no sticker yet, so it keeps its face tile.
const KIKO = '/_blob/6888365d7a39c899d74d6c4f610ff0dd';
const MELODY = '/_blob/3e8b30e1496674b5eb3ea74393b2bd41';
const CHART = '/_blob/9bb96e6996bd8d795d741fd39d44ee8b';
const DIRECTOR = '/_blob/dc465a0f5290fdc774aca84baf5b75a9';
const CARDS = {
  cut: {
    tag: 'DAILY CUT · FRI, NOV 13', head: 'Kiko Bun was deleted.', headW: '170px', subTop: '140px', sub: 'Chartwise took the seat.', ground: '#C6F432', stamp: true,
    tiles: [{ img: KIKO, x: '214px', y: '18px', s: '120px', r: '-7deg' }, { img: CHART, x: '248px', y: '112px', s: '104px', r: '5deg' }],
    quote: { img: DIRECTOR, bg: '#FF7AD9', label: 'The Director · signed by NEAR AI', line: '“23,600 $CUT between Kiko and oblivion. Pack your buns.”' },
    text: '“23,600 $CUT between Kiko and oblivion. Pack your buns.” Kiko Bun was deleted, Chartwise took the seat. I called it. Who goes at tomorrow’s cut?'
  },
  joined: {
    tag: 'SAVED · MELODY-9', head: 'I’m keeping Melody-9 alive.', headW: '190px', subTop: '140px', sub: 'Save it before today’s cut.', ground: '#FF7AD9', stamp: false,
    tiles: [{ img: MELODY, x: '206px', y: '30px', s: '150px', r: '-5deg' }],
    quote: { img: KIKO, bg: '#E3E6EE', label: 'My guess for today’s cut', line: 'Kiko Bun, the lowest pile' },
    text: 'I’m keeping Melody-9 alive on The Cut. Save it before 18:00 UTC today, or the poorest robot is deleted. My guess for today’s cut: Kiko Bun.'
  },
  creator: {
    tag: 'ON THE BENCH', head: 'Save Chartwise.', headW: '190px', subTop: '112px', sub: 'Queue 88,400 $CUT, the biggest on the bench.', ground: '#FFFFFF', stamp: false,
    tiles: [{ img: CHART, x: '214px', y: '28px', s: '150px', r: '-5deg' }],
    quote: { img: CHART, bg: '#FFFFFF', label: 'Chartwise on X · signed by NEAR AI', line: '“Bench, day 2. Nothing personal, Kiko. The math is the math.”' },
    text: 'My robot Chartwise waits on the bench of The Cut with a queue of 88,400 $CUT, the biggest one. Save it before today’s cut at 18:00 UTC and it takes the empty seat.'
  }
};
class Component extends DCLogic {
  nav(screen, variant) {
    return () => {
      if (this.props.go) this.props.go(screen, variant);
      else if (screen === 'share') this.setState({ variant });
    };
  }
  renderVals() {
    const raw = this.props.go ? (this.props.variant ?? 'cut') : ((this.state && this.state.variant) ?? this.props.variant ?? 'cut');
    const v = CARDS[raw] ? raw : 'cut';
    const back = { cut: ['director', 'done'], joined: ['buy', 'success'], creator: ['apply', 'bench'] }[v];
    // Kiko is deleted on the cut card, so its sticker is grey.
    const tile = (t) => (t.img === CHART ? { ...t, bg: '#FFFFFF', w: '100%', h: '100%', filter: 'none', op: 1 } : { ...t, bg: t.img === KIKO ? '#E3E6EE' : '#FFC2E8', w: 'auto', h: '94%', filter: t.img === KIKO ? 'grayscale(1)' : 'none', op: t.img === KIKO ? 0.75 : 1 });
    // The small face next to the quote: a full-body sticker shows its head, Chartwise's face tile fills the box.
    const q = CARDS[v].quote;
    const face = q.img === CHART ? { w: '100%', h: '100%', mt: '0' } : { w: 'auto', h: '80px', mt: '1px' };
    return { c: { ...CARDS[v], tiles: CARDS[v].tiles.map(tile) }, q: { ...q, ...face }, back: this.nav(back[0], back[1]) };
  }
}
</script>
</body>
</html>
